<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ayushman Choudhuri — Roboticist specializing in autonomous systems and AI-driven perception technologies.">
  <title>Ayushman Choudhuri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <!-- ============================================================
       HERO — interactive 3D Spline robot
       ============================================================ -->
  <section class="hero">
    <spline-viewer
      class="hero-spline-viewer"
      aria-hidden="true"
      url="https://prod.spline.design/PyzDhpQ9E5f1E3MT/scene.splinecode"></spline-viewer>
    <div class="hero-spline-overlay">
      <div class="hero-flank hero-flank-left">
        <p class="hero-eyebrow fade-in fade-in-1">Robotics Engineer &amp; AI Researcher</p>
        <h1 class="fade-in fade-in-2">Hi, I'm <span>Ayushman</span></h1>
      </div>
      <div class="hero-flank hero-flank-right">
        <p class="hero-subtitle fade-in fade-in-3">
          I help robots understand the world.
        </p>
        <div class="hero-ctas fade-in fade-in-4">
          <a href="/about.html" class="btn btn-primary">About Me</a>
          <a href="/projects.html" class="btn btn-secondary">View Projects</a>
        </div>
      </div>
    </div>
    <div class="hero-scroll">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
      scroll
    </div>
  </section>

  <!-- ============================================================
       FEATURED PROJECTS
       ============================================================ -->
  <section class="featured-section">
    <div class="container">
      <div class="section-header">
        <p class="section-eyebrow">Selected Work</p>
        <h2 class="section-title">Featured Projects</h2>
        <p class="section-desc">A selection of recent projects spanning AI perception, autonomous systems, and robotics.</p>
      </div>
      <div class="projects-grid" id="featured-grid"></div>
      <div style="margin-top:40px;text-align:center">
        <a href="/projects.html" class="btn btn-secondary">View All Projects &rarr;</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="/js/components.js"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"></script>
  <script src="/data/projects.js"></script>
  <script>
    var featured = window.PROJECTS.recent.slice(0, 3);
    var grid = document.getElementById('featured-grid');
    if (grid) {
      grid.innerHTML = featured.map(function (p) {
        var imgHTML = p.image
          ? '<div class="project-card-img"><img src="' + p.image + '" alt="' + p.title + ' preview" loading="lazy"></div>'
          : '<div class="project-card-img"></div>';
        return '<a href="' + p.href + '" class="project-card">' +
          imgHTML +
          '<div class="project-card-header">' +
            '<span class="project-card-status ' + (p.status === 'active' ? 'status-active' : 'status-completed') + '">' +
              (p.status === 'active' ? 'In Progress' : 'Completed') +
            '</span>' +
          '</div>' +
          '<h3>' + p.title + '</h3>' +
          '<p>' + p.description + '</p>' +
          '<div class="tags">' +
            p.tags.slice(0, 3).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') +
          '</div>' +
          '<div class="project-card-footer">' +
            '<span class="project-card-date">' + p.date + '</span>' +
            '<span class="project-card-link">View &rarr;</span>' +
          '</div>' +
        '</a>';
      }).join('');
    }
  </script>
</body>
</html>
