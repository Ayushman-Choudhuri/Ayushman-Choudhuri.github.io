        },
        {
          heading: 'Motivation',
          content: '<p>Deforestation is one of the leading drivers of biodiversity loss and carbon emissions. Existing satellite-monitoring tools can flag changes in forest cover, but they provide little context about <em>why</em> the change occurred or what the downstream ecological impact might be. TerraWatch bridges that gap by pairing visual detection with language-model reasoning.</p>'
        },
        {
          heading: 'Technical Approach',
          content: '<p>The system works in two stages:</p><ul><li><strong>Vision stage:</strong> A computer vision model processes multispectral satellite imagery to segment and quantify areas of vegetation loss. Change detection between temporal image pairs highlights newly deforested regions.</li><li><strong>Language stage:</strong> A multimodal LLM receives the visual evidence alongside geographic and contextual metadata. It reasons about probable causes (agriculture, logging, wildfires) and generates a natural-language report on predicted environmental effects.</li></ul>'

        {
