        {
          heading: 'Overview',
          content: '<p>mcap2hdf5 is a command-line tool for converting ROS2 MCAP sensor recordings into synchronized, machine learning-ready HDF5 datasets. It bridges the gap between raw robotics data collection and the structured formats required by ML training pipelines — removing the need for custom one-off conversion scripts for every new dataset.</p>'
        },
        {
          heading: 'Motivation',
          content: '<p>ROS2 MCAP recordings are the standard output of sensor rigs in autonomous driving and robotics research, but they are not directly consumable by ML frameworks. Extracting synchronized, aligned multi-modal data from MCAP files typically requires significant boilerplate. mcap2hdf5 automates this pipeline with a configurable, reusable CLI workflow.</p>'
        },
        {
          heading: 'Workflow',
          content: '<p>The tool exposes three commands that cover the full conversion pipeline:</p><ul><li><strong>inspect:</strong> Analyze an MCAP file — view available topics, auto-detect sensor modalities, and summarize recording metadata</li><li><strong>init:</strong> Auto-generate a YAML job configuration file from an MCAP recording, which can then be reviewed and customized before conversion</li><li><strong>convert:</strong> Execute the conversion, producing a synchronized HDF5 dataset with all selected sensor streams aligned to a common timestamp axis</li></ul>'
        },
        {
          heading: 'Supported Modalities',
