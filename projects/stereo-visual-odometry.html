          heading: 'Overview',
          content: '<p>This project implements a stereo visual odometry (VO) pipeline to estimate the ego-motion of an autonomous vehicle using stereo camera data from the KITTI benchmark dataset. Visual odometry is a fundamental component in autonomous driving, providing a lightweight alternative to GPS-based localization when satellite signals are unavailable or unreliable.</p>'
        },
        {
          heading: 'Pipeline',
          content: '<p>The VO pipeline follows a classical approach:</p><ul><li><strong>Stereo rectification:</strong> Aligning left and right image pairs using known camera calibration parameters</li><li><strong>Disparity estimation:</strong> Computing per-pixel depth using semi-global block matching (SGBM)</li><li><strong>3D point reconstruction:</strong> Lifting 2D feature correspondences to 3D via the disparity map and camera model</li><li><strong>Feature detection and matching:</strong> FAST/ORB keypoints tracked across consecutive frames</li><li><strong>Motion estimation:</strong> Solving the 3D-3D PnP problem to recover rotation and translation between frames</li><li><strong>Pose integration:</strong> Accumulating frame-to-frame transforms to produce a full trajectory estimate</li></ul>'
        },
        {
          heading: 'Evaluation',
          content: '<p>The pipeline was evaluated on several KITTI odometry sequences. Trajectory error was computed using the standard KITTI evaluation toolkit, comparing estimated paths against ground-truth GPS/IMU trajectories. The implementation achieves competitive results relative to classical VO baselines on the benchmark.</p>'
