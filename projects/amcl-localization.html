        {
          heading: 'Overview',
          content: '<p>This project implements mobile robot localization using the Adaptive Monte Carlo Localization (AMCL) algorithm within the ROS ecosystem. AMCL is a probabilistic localization method that maintains a particle filter to estimate the robot\'s pose within a known map, adapting the number of particles based on localization uncertainty.</p>'
        },
        {
          heading: 'Algorithm',
          content: '<p>AMCL estimates the robot\'s 2D pose (x, y, heading) using a particle filter:</p><ul><li><strong>Particle filter:</strong> A set of weighted pose hypotheses represents the belief distribution over robot position</li><li><strong>Motion model:</strong> Particles are propagated forward using odometry data with added noise</li><li><strong>Sensor model:</strong> Particle weights are updated using laser scan likelihood against the known map</li><li><strong>Resampling:</strong> Particles are resampled proportional to their weights; particle count is adapted based on KLD-sampling to match the current uncertainty</li></ul>'
        },
        {
          heading: 'Setup & Results',
          content: '<p>The project was implemented and tested in Gazebo with a differential-drive robot equipped with a 2D laser scanner. RViz was used to visualize the particle cloud and estimated pose in real time. The robot successfully localized within a pre-built occupancy grid map and maintained accurate localization through extended navigation runs.</p>'
        }
      ]
