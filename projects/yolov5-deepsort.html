        {
          heading: 'Overview',
          content: '<p>This project implements a real-time multi-object tracking (MOT) system by combining YOLOv5 for per-frame object detection with DeepSORT for maintaining persistent identity tracks across frames in video streams. The result is a robust system capable of tracking multiple objects simultaneously even through occlusions and re-entries.</p>'
        },
        {
          heading: 'Architecture',
          content: '<p>The system follows the standard tracking-by-detection paradigm:</p><ul><li><strong>Detection:</strong> YOLOv5 runs inference on each frame, producing bounding boxes, class labels, and confidence scores</li><li><strong>Feature extraction:</strong> A lightweight re-identification (ReID) network computes appearance embeddings for each detected object</li><li><strong>Data association:</strong> DeepSORT combines Kalman filter motion predictions with appearance embeddings via the Hungarian algorithm to assign detections to existing tracks</li><li><strong>Track management:</strong> Tracks are created, maintained, and deleted based on age and detection confidence thresholds</li></ul>'
        },
        {
          heading: 'Key Features',
          content: '<ul><li>Handles multiple object classes simultaneously (pedestrians, vehicles, cyclists)</li><li>Robust to short-term occlusions through Kalman filter prediction</li><li>Configurable confidence and IoU thresholds</li><li>Annotated video output with track IDs and bounding boxes</li></ul>'
        }
