          content: '<p>Brusrol is an assistive oral hygiene device co-developed with Dr. Jaskirat Kaur to enable people with motor disabilities to brush their teeth independently. The project won the Provenance business competition in 2018, recognizing both its social impact and commercial viability.</p>'
        },
        {
          heading: 'Problem',
          content: '<p>Individuals with conditions such as cerebral palsy, muscular dystrophy, or post-stroke motor impairment often struggle with the fine motor control required for toothbrushing. Standard electric toothbrushes partially help, but do not address grip stability, brushing motion guidance, or the need for single-handed or hands-free operation. Poor oral hygiene resulting from this gap contributes to broader health complications.</p>'
        },
        {
          heading: 'Design',
          content: '<p>Brusrol was designed in close consultation with occupational therapists and end-users to ensure it addressed real functional barriers rather than perceived ones. Key design features included:</p><ul><li>Ergonomic grip adapted for limited hand function</li><li>Assisted brushing motion to reduce the motor demand on the user</li><li>Safe, easy-to-clean materials appropriate for medical device standards</li><li>Minimal maintenance requirements for caregivers and users alike</li></ul>'
        },
        {
          heading: 'Recognition',
          content: '<p>Brusrol won the Provenance business competition in 2018, validating the product concept from both a technical and market perspective. The project represents a broader philosophy of applying engineering skills to challenges that directly improve quality of life for underserved populations.</p>'
