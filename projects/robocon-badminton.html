          heading: 'Mechanical Design',
          content: '<p>Two key mechanical challenges defined the design:</p><ul><li><strong>Holonomic drive:</strong> Standard differential-drive robots cannot strafe laterally, which is critical for court positioning. The robots used a holonomic wheel configuration (mecanum or omnidirectional wheels) enabling full 2D mobility — any combination of translation and rotation in the arena plane.</li><li><strong>Pneumatic shot mechanism:</strong> A rapid-actuation pneumatic system was designed to strike the shuttlecock with consistent force and direction. Solenoid valves controlled shot timing, with pressure regulation ensuring repeatable trajectory.</li></ul>'
