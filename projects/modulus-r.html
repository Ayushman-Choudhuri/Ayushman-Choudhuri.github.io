          content: '<p>MODULUS R is a 3-axis gantry-based robotic milling machine designed specifically for machining large Glass Fiber Reinforced Polymer (GFRP) enclosures. The system accommodates workpieces up to 1.2 m in height and is rated to IP65 for operation in dusty industrial environments — a critical requirement when cutting GFRP, which produces fine glass fiber particulates.</p>'

        {
          heading: 'Design Challenges',
          content: '<p>Machining large GFRP components presents several engineering challenges:</p><ul><li><strong>Workpiece size:</strong> Standard CNC machines cannot accommodate enclosures in the 1–1.5 m range; a custom gantry architecture was required</li><li><strong>Dust management:</strong> GFRP milling generates abrasive glass fiber dust that damages machine components — the IP65 enclosure design protects all electronics and linear guides</li><li><strong>Material properties:</strong> GFRP is anisotropic and delamination-prone; toolpaths and feed rates were optimized for clean cuts without fiber pull-out</li><li><strong>Structural stiffness:</strong> The large gantry span demanded careful structural analysis to maintain cutting accuracy across the full working volume</li></ul>'
        },
